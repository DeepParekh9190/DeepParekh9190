<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Deep Parekh, front-end developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#100a1c"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="70%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-0.6;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8b5cf6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <rect width="1200" height="300" rx="16" fill="url(#grid)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- title bar -->
  <circle cx="34" cy="34" r="6" fill="#f87171">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="56" cy="34" r="6" fill="#fbbf24">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="34" r="6" fill="#34d399">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">deep@portfolio ~ %</text>

  <line x1="0" y1="58" x2="1200" y2="58" stroke="#1e293b" stroke-width="1"/>

  <!-- prompt -->
  <text x="60" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#22d3ee">
    <tspan fill="#8b5cf6">›</tspan> whoami
  </text>
  <rect x="176" y="89" width="9" height="18" fill="#67e8f9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="58" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="url(#nameFill)" filter="url(#soft)">
    Deep Parekh
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.12;0.45" dur="3.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 0" keyTimes="0;1" dur="3.2s" fill="freeze"/>
  </text>

  <!-- subtitle lines, revealed in sequence -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">
    <text x="60" y="218" opacity="0">front-end developer <tspan fill="#475569">·</tspan> react <tspan fill="#475569">·</tspan> typescript <tspan fill="#475569">·</tspan> tailwind
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;0.7" dur="3.2s" fill="freeze"/>
    </text>
    <text x="60" y="248" fill="#64748b" opacity="0">now shipping client sites at <tspan fill="#a78bfa">Eternal CraftLab</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;0.95" dur="3.6s" fill="freeze"/>
    </text>
  </g>

  <!-- right side: pulsing stack rings -->
  <g transform="translate(1010 150)" fill="none" stroke-width="1.5">
    <circle r="46" stroke="#8b5cf6" stroke-opacity="0.25">
      <animate attributeName="r" values="38;52;38" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" stroke="#22d3ee" stroke-opacity="0.18">
      <animate attributeName="r" values="66;82;66" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.25;0.04;0.25" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="100" stroke="#8b5cf6" stroke-opacity="0.12">
      <animate attributeName="r" values="94;112;94" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="#8b5cf6" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.06;0.18;0.06" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c4b5fd">UI</text>
  </g>

  <!-- scanline -->
  <rect x="0" y="-4" width="1200" height="2" fill="#67e8f9" opacity="0.12">
    <animate attributeName="y" values="-4;302" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corners -->
  <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M18 42V18h26">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1182 258v24h-26">
      <animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="16" stroke="url(#edge)" stroke-width="1.6" fill="none"/>
</svg>
