<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="3" width="1200" height="1.5" fill="url(#line)"/>
  <rect y="3" width="220" height="1.5" fill="url(#spark)">
    <animate attributeName="x" values="-220;1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <circle cy="3.75" r="2.5" fill="#67e8f9" opacity="0.9">
    <animate attributeName="cx" values="-220;1200" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
